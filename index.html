<style id="css-pixel" media="not all">
:root{
  /* layout: demo switcher on top, one phone-sized game screen below; single dark "night arcade" theme by choice */
  color-scheme: dark;
  --night:#1a1c3d;      /* page + game sky */
  --panel:#2b2f63;      /* cards */
  --ink:#fff6dc;        /* text */
  --dim:#aab0e6;        /* secondary text */
  --pink:#ff5d8f;       /* primary action */
  --mint:#3ddc97;       /* done / good */
  --sun:#ffd23f;        /* points, stars */
  --sky:#59c3ff;        /* waiting */
  --line:#0c0d22;       /* pixel outlines */
  --display:"Press Start 2P","Courier New",monospace;
  --body:"Pixelify Sans","Trebuchet MS",Verdana,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.35;
  display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 16px 16px}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* pixel frame: 4px stepped outline without rounded corners */
.px{border:0;box-shadow:0 -4px 0 var(--line),0 4px 0 var(--line),-4px 0 0 var(--line),4px 0 0 var(--line)}

.demo{width:100%;max-width:420px;display:flex;flex-direction:column;gap:6px}
.demo small{font-size:13px;color:var(--dim)}
.roles{display:flex;gap:10px;flex-wrap:wrap;padding:4px}
.roles button{flex:1;min-width:84px;background:var(--panel);padding:8px 6px;font-weight:600}
.roles button[aria-pressed="true"]{background:var(--sun);color:var(--line)}
.roles .ghost{flex:0 0 auto;background:transparent;color:var(--dim);font-size:14px;box-shadow:none;text-decoration:underline}

.game{width:100%;max-width:420px;flex:1;min-height:560px;display:flex;flex-direction:column;background:
  linear-gradient(#23265a 0 55%,#34286b 55% 100%);position:relative;overflow:hidden;margin:4px}
.stars{position:absolute;inset:0;pointer-events:none;background-image:
  radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#ffd23f 1px,transparent 1.5px);
  background-size:90px 70px,130px 110px;background-position:10px 20px,60px 50px;opacity:.35}
.hud{position:relative;display:flex;gap:12px;align-items:center;padding:14px 14px 10px}
.ava{width:64px;height:64px;background:var(--panel);flex:0 0 auto;display:grid;place-items:center;padding:6px}
.ava svg{width:100%;height:100%}
.hud h1{font-family:var(--display);font-size:12px;line-height:1.5;text-wrap:balance}
.hud .lvl{color:var(--sun);font-size:15px;font-weight:600}
.chips{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.chip{background:var(--line);padding:2px 8px;font-size:14px;white-space:nowrap}
.xp{position:relative;margin:2px 18px 8px;display:grid;grid-template-columns:repeat(20,1fr);gap:2px;height:16px;background:var(--line);padding:3px}
.xp i{background:#3a3f7d}
.xp i.on{background:var(--sun)}
.xpnote{position:relative;display:flex;justify-content:space-between;margin:0 16px 8px;font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}

.view{position:relative;flex:1;overflow-y:auto;padding:6px 16px 14px;display:flex;flex-direction:column;gap:12px}
h2{font-family:var(--display);font-size:10px;color:var(--sun);letter-spacing:.5px;margin-top:4px}
.q{display:flex;align-items:center;gap:10px;background:var(--panel);padding:10px;width:100%;text-align:left}
.q .ic{width:40px;height:40px;background:var(--line);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.q .t{flex:1;min-width:0}
.q .t b{display:block;font-weight:600}
.q .t span{font-size:14px;color:var(--dim)}
.q .pts{font-family:var(--display);font-size:10px;color:var(--sun);white-space:nowrap}
.q.pending{background:#24507a}.q.pending .t span{color:var(--sky)}
.q.done{background:#1f5a48;opacity:.85}.q.done .t b{text-decoration:line-through}
.q.done .t span{color:var(--mint)}
button.q:active,.btn:active{transform:translateY(2px)}
.btn{background:var(--pink);color:#fff;padding:9px 12px;font-weight:700}
.btn.mint{background:var(--mint);color:var(--line)}
.btn.flat{background:var(--line);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px}
.card p{font-size:16px}
.muted{color:var(--dim);font-size:14px}

.goal{display:flex;gap:16px;align-items:center}
.phone{width:104px;height:176px;background:var(--line);padding:8px;position:relative;flex:0 0 auto}
.phone .scr{width:100%;height:100%;background:#12132c;position:relative;overflow:hidden;display:flex;align-items:flex-end}
.phone .fill{width:100%;background:repeating-linear-gradient(var(--pink) 0 8px,#ff7fa6 8px 16px);transition:height .6s steps(8)}
.phone .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:13px;text-shadow:2px 2px 0 var(--line)}
.phone::before{content:"";position:absolute;top:8px;left:50%;width:28px;height:6px;margin-left:-14px;background:var(--line);z-index:1}
.marks{display:flex;flex-direction:column;gap:6px;font-size:15px}
.marks .hit{color:var(--mint)}
.avapick{display:flex;gap:12px;padding:4px}
.avapick button{width:56px;height:56px;background:var(--panel);padding:6px}
.avapick button[aria-pressed="true"]{background:var(--sun)}
.avapick svg{width:100%;height:100%}

.msg{background:var(--panel);padding:10px}
.msg b{color:var(--sun);font-weight:600}
.msg.sys b{color:var(--mint)}

.nav{position:relative;display:flex;background:var(--line)}
.nav button{flex:1;background:transparent;border:0;padding:12px 4px 10px;font-weight:600;color:var(--dim);position:relative}
.nav button[aria-pressed="true"]{color:var(--sun);background:#191a3a}
.nav .dot{position:absolute;top:8px;right:22%;width:8px;height:8px;background:var(--pink)}

input[type=text],input[type=number]{background:var(--line);border:0;padding:9px 10px;min-width:0;flex:1}
input[type=number]{flex:0 0 70px}
label{font-size:14px;color:var(--dim)}

.over{position:absolute;inset:0;background:rgba(12,13,34,.92);display:grid;place-items:center;padding:20px;z-index:5;text-align:center}
.over .box{display:flex;flex-direction:column;gap:14px;align-items:center;max-width:300px}
.over h3{font-family:var(--display);font-size:14px;line-height:1.6;color:var(--sun);text-wrap:balance}
.over .big{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}
.over .sprite{width:96px;height:96px;animation:hop .5s steps(2) infinite alternate}
@keyframes hop{to{transform:translateY(-14px)}}
.toast{position:absolute;left:16px;right:16px;bottom:64px;background:var(--mint);color:var(--line);padding:10px;font-weight:700;text-align:center;z-index:4}
.coin{position:absolute;width:12px;height:12px;background:var(--sun);box-shadow:0 0 0 3px var(--line);z-index:6;pointer-events:none;animation:fly .9s steps(9) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy));opacity:0}}
@media (prefers-reduced-motion:reduce){.over .sprite,.coin{animation:none}.phone .fill{transition:none}}
</style>

<style>

.xpnote{font-size:16px}
.xpnote b{color:var(--ink);font-weight:800}
.mon{display:inline-block;width:.95em;height:.95em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc93c 55%,#e09a00);box-shadow:inset 0 0 0 .12em #c98500;vertical-align:-.14em;margin:0 .22em}
#cheer{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:20;text-align:center;padding:18px 26px;border-radius:24px;
  background:linear-gradient(180deg,#ffe9a6,#ffb347);color:#3a2408;box-shadow:0 0 44px rgba(255,196,107,.85),0 10px 30px rgba(0,0,0,.4);width:max-content;max-width:300px;
  transition:transform .28s cubic-bezier(.2,1.6,.4,1),opacity .2s}
#cheer.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#cheer b{display:block;font-family:var(--display);font-size:20px;line-height:1.35}
#cheer span{font-size:15px;font-weight:700}
button[disabled]{opacity:.5}
@media (prefers-reduced-motion:reduce){#cheer{transition:none}}
body{padding:8px 10px 10px}
.topbtn{position:absolute;top:38px;right:12px;z-index:3;background:rgba(0,0,0,.4);color:inherit;border:0;border-radius:999px;padding:5px 11px;font-size:13px;box-shadow:none}
.screen{position:relative;flex:1;display:flex;flex-direction:column;gap:14px;justify-content:center;padding:28px 22px;text-align:center}
.screen h1{font-family:var(--display);font-size:18px;line-height:1.5;text-wrap:balance}
.screen .roles{flex-direction:column}
.screen .roles button{padding:14px;font-size:19px}
.screen .roles small{display:block;font-size:13px;font-weight:500;opacity:.8;margin-top:2px}
input,select{background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:9px 10px;min-width:0;color:inherit;font-family:inherit;font-size:inherit}
select option{color:#111}
.pin{letter-spacing:10px;text-align:center;font-size:26px;width:170px;align-self:center}
.codein{text-align:center;text-transform:uppercase;letter-spacing:3px;font-size:20px}
.err{color:#ffb3bf;font-size:15px;min-height:22px}
.link{background:transparent;border:0;box-shadow:none;color:inherit;opacity:.75;text-decoration:underline;font-size:14px;padding:6px}
.pick [aria-pressed="true"]{outline:3px solid currentColor;outline-offset:1px}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px}
.codebox{font-family:monospace;font-size:20px;letter-spacing:3px;user-select:all}
.note{font-size:13px;opacity:.85}
.q .rm{flex:0 0 auto}

 ['🎒','Собрать портфель с вечера',1,'day',0],['📖','Чтение 15 минут',2,'day',15],['🗑️','Вынести мусор',1,'day',0],
 ['👗','Приготовить одежду на завтра',1,'day',0],['🌙','Лечь спать вовремя',1,'day',0],['🌳','Погулять на улице 30 минут',1,'day',0],
 ['🍽️','Помыть посуду',2,'day',0],['🎨','Рисование или музыка 15 минут',2,'day',15],['🧸','Разобрать игрушки и полки',2,'week',0],

 ['📜','Выучить стих',5,'once',0],['🍳','Помочь с готовкой',2,'once',0],['🏆','Челлендж от папы',5,'once',0],['💌','Сделать открытку или сюрприз',3,'once',0]];
const ERR={bad_code:'Код не подошёл. Проверь буквы и цифры.',bad_pin:'Неверный PIN.',pin_format:'PIN должен быть из 4 цифр.',pin_exists:'PIN уже задан. Введи его.',weekend:'В выходные уроков нет.',alt_rest:'Вчера уже было. Сегодня отдых.',already:'Этот бонус уже сделан.',not_admin:'Это может только папа.',bad_day:'Эту дату отметить нельзя.',net:'Нет связи. Попробуй ещё раз.'};

let D=null,code=null,lastJson='',prevPoints=null;
const U={edit:null,sure:null,screen:'load',role:null,pin:null,pinRole:null,tab:'quests',ptab:'check',over:null,toast:'',timer:null,err:'',busy:false,icon:'⭐'};

async function rpc(fn,args){
  let r,j=null;
  try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})})}catch(e){throw new Error('net')}
  try{j=await r.json()}catch(e){throw new Error('net')}
  if(!j||j.error)throw new Error(j&&j.error||'net');
  return j.result;
}
const errText=e=>ERR[e.message]||ERR.net;

/* ---------- dates ---------- */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const shift=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
function weekStart(){const d=new Date();const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return iso(d)}
function dayLabel(s){const t=today();if(s===t)return 'сегодня';if(s===shift(t,-1))return 'вчера';const p=s.split('-');return p[2]+'.'+p[1]}

/* ---------- derived ---------- */
const fam=()=>D.family;
const theme=()=>LS.get('mytheme')||(D&&fam().theme)||LS.get('theme')||'glass';
const pct=()=>Math.min(100,Math.round(D.points/fam().target*100));
const level=()=>Math.min(4,Math.floor(pct()/25));
function dayNo(){const a=new Date(fam().start_date+'T12:00:00'),b=new Date(today()+'T12:00:00');return Math.max(1,Math.round((b-a)/864e5)+1)}
function streak(){const s=new Set(D.done.filter(d=>d.status!=='rejected'&&d.kind!=='care').map(d=>d.day));let t=today(),n=0;if(!s.has(t))t=shift(t,-1);while(s.has(t)){n++;t=shift(t,-1)}return n}
function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c}
function isWeekend(){const d=new Date().getDay();return d===0||d===6}
function lateNow(due){if(!due)return false;const n=new Date();return n.getHours()*60+n.getMinutes()>+due.slice(0,2)*60+ +due.slice(3)}
function statusOf(t){let r=D.done.find(d=>d.task_id===t.id&&d.day===today());
  if(!r&&t.kind==='once')r=D.done.filter(d=>d.task_id===t.id&&d.status!=='rejected').pop();
  if(!r&&t.kind==='alt'&&D.done.some(d=>d.task_id===t.id&&d.day===shift(today(),-1)&&d.status!=='rejected'))return{s:'rest'};
  if(!r&&t.kind==='school'&&isWeekend())return{s:'off'};
  if(!r)return{s:'todo'};return{s:r.status==='approved'?'done':r.status==='rejected'?'back':'pending',r}}
function unread(){const seen=LS.get('seen')||'';return D.msgs.filter(m=>m.at>seen&&m.from!=='child').length}
function sprite(n){
  if(theme()==='pixel'){let r='';(SPR[n]||SPR.cat).forEach((row,y)=>[...row].forEach((c,x)=>{if(c!=='.')r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[c]}"/>`}));return `<svg viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`}
  return `<span class="emo" aria-hidden="true">${EMO[n]||EMO.cat}</span>`;
}
function applyTheme(){const t=theme();$('css-pixel').media=t==='pixel'?'all':'not all';$('css-glass').media=t==='pixel'?'not all':'all'}

/* ---------- effects ---------- */
let ac;function beep(f=660,d=.08){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function coins(){const g=$('game');for(let i=0;i<14;i++){const c=document.createElement('i');c.className='coin';c.style.left='50%';c.style.top='55%';c.style.setProperty('--dx',(Math.random()*280-140)+'px');c.style.setProperty('--dy',(-Math.random()*260-40)+'px');g.appendChild(c);setTimeout(()=>c.remove(),1000)}}
function toast(t){U.toast=t;render();clearTimeout(toast.h);toast.h=setTimeout(()=>{U.toast='';render()},2400)}

/* ---------- data flow ---------- */
function accept(state){
  D=state;LS.set('theme',fam().theme);
  if(U.role==='kid'&&U.screen==='app'){
    if(prevPoints!==null&&D.points>prevPoints){const n=D.points-prevPoints;coins();beep(880);setTimeout(()=>beep(1175),90);if(petOn())sayG('confirmed');else cheer('Квест подтвердили! +'+n+' '+plural(n,'монета','монеты','монет')+'!','')}
    const rj=D.done.filter(d=>d.status==='rejected').map(d=>d.id),known=accept.rj;accept.rj=new Set(rj);
    if(known&&rj.some(x=>!known.has(x)))setTimeout(()=>sayG('back'),400);
    const k='lvl_'+fam().season,seen=LS.get(k),lv=D.points>=fam().target?5:level();
    if(seen===null)LS.set(k,lv);
    else if(lv>+seen){LS.set(k,lv);if(!U.over)U.over=lv===5?'win':'level'}
    else if(lv<+seen)LS.set(k,lv);
  }
  prevPoints=D.points;
}
/* S0 is the last state the server confirmed; pend holds actions shown on screen but not yet confirmed */
let S0=null;const pend=[];
const clone=o=>JSON.parse(JSON.stringify(o));
function rebuild(){if(!S0)return;const s=clone(S0);pend.forEach(p=>{try{p.apply(s)}catch(e){}});accept(s)}
function setServer(s){S0=s;lastJson=JSON.stringify(s);LS.set('state',lastJson);rebuild()}
function drop(op){const i=pend.indexOf(op);if(i>=0)pend.splice(i,1)}
async function load(silent){
  if(silent&&pend.length)return true;
  try{const s=await rpc('mq_state',{p_code:code});if(silent&&pend.length)return true;if(silent&&JSON.stringify(s)===lastJson)return true;setServer(s);render();return true}
  catch(e){if(!silent){U.err=errText(e);render()}return e.message!=='bad_code'?null:false}
}
let chain=Promise.resolve();
function act(fn,args,okMsg,apply){
  const op={apply};
  if(apply){pend.push(op);rebuild();if(okMsg)toast(okMsg);else render()}
  const r=chain.then(()=>doAct(fn,args,apply?null:okMsg,op));chain=r.catch(()=>{});return r;
}
async function doAct(fn,args,okMsg,op){
  U.busy=true;
  try{const s=await rpc(fn,Object.assign({p_code:code},args));drop(op);setServer(s);U.busy=false;if(okMsg)toast(okMsg);else render();return true}
  catch(e){U.busy=false;drop(op);rebuild();if(e.message==='bad_pin'){U.pin=null;U.screen='who'}toast((op.apply?'Не сохранилось. ':'')+errText(e));return false}
}

const PH={"greet_morning":[["g01","Доброе утро, Мелисса! Новый день — новые квесты."],["g02","Мур, проснулась? Пойдём собирать монетки!"],["g03","Доброе утро! Начнём с простого: заправим постель?"],["g04","Утро — лучшее время для подвигов. Погнали!"],["g05","Привет-привет! Мне без тебя было скучно."]],"greet_day":[["g06","Привет, Мелисса! Как дела в школе?"],["g07","О, ты пришла! Посмотрим, что у нас на сегодня."],["g08","Привет! Сначала перекус, потом квесты?"],["g09","Мур! Уроки ждут, а монетки — тем более."]],"greet_evening":[["g10","Добрый вечер! Ещё есть время собрать монетки."],["g11","Вечер — время закончить начатое. Я с тобой!"],["g12","Привет! Не забудь почистить зубы перед сном."],["g13","Добрый вечер, Мелисса! Что сегодня успели?"]],"greet_weekend":[["g14","Сегодня выходной! Уроков нет, но квесты ждут."],["g15","Ура, выходные! Самое время для квестов недели."],["g16","Выходной! Сделаем пару дел — и гулять?"]],"streak":[["s01","Ты не пропускаешь ни дня! Так держать!"],["s02","Серия продолжается! Вот это упорство!"],["s03","Каждый день в деле! Я тобой горжусь!"]],"praise":[["p01","Ура! Ты молодец!"],["p02","Вот это да! Так держать!"],["p03","Супер! Я тобой горжусь!"],["p04","Отлично! Мама скоро проверит."],["p05","Мур-мур! Ещё одна монетка на подходе!"],["p06","Ты настоящая героиня!"],["p07","Класс! Вот это скорость!"],["p08","Браво! Дело сделано!"],["p09","Ты просто чемпионка!"],["p10","У меня от радости хвост трубой!"],["p11","Есть! Ещё на шаг ближе к цели!"],["p12","Молодчина! Так и надо!"],["p13","Вот это я понимаю — работа!"],["p14","Пять с плюсом! Дай лапку!"],["p15","Делу время, а монеткам — копилка!"]],"care":[["cr1","Отмечено! Забота о себе — это важно."],["cr2","Чистота — залог здоровья! Мур!"],["cr3","Ты заботишься о себе. Это очень правильно!"],["cr4","Блестят зубки, сияет улыбка!"]],"confirmed":[["c01","Квест подтвердили! Монетки твои!"],["c02","Дзынь! Монетки упали в копилку!"],["c03","Подтверждено! Шкала подросла!"],["c04","Ура, засчитали! Ты function pick(g){const list=PH[g]||[];let recent=[];try{recent=JSON.parse(LS.get('said')||'[]')}catch(e){}
  let pool=list.filter(x=>!recent.includes(x[0]));if(!pool.length)pool=list;const x=pool[Math.floor(Math.random()*pool.length)];
  recent=[x[0],...recent.filter(r=>r!==x[0])].slice(0,30);LS.set('said',JSON.stringify(recent));return x}

  b.style.maxWidth=Math.min(230,W-16)+'px';const bw=b.offsetWidth;let off=-6;if(petX+off+bw>W-8)off=W-8-bw-petX;if(petX+off<8)off=8-petX;
  b.style.left=off+'px';const tl=Math.max(12,Math.min(bw-28,pw/2-8-off));b.style.setProperty('--tail',tl+'px');b.style.transformOrigin=(tl+8)+'px 100%'}

function petWalk(){if(!petOn()||PET.classList.contains('talk'))return;const g=$('game');if(!g)return;const w=g.clientWidth-90;const nx=Math.round(10+Math.random()*Math.max(20,w-10));

function markQuest(id,quiet){

    h+=overlay();
  }
  if(U.toast)h+=`<div class="toast px" role="status">${esc(U.toast)}</div>`;
  g.innerHTML=h;
  const nv=g.querySelector('.view');if(nv)nv.scrollTop=sc;
  if(petOn()&&!U.over){g.appendChild(PET);petX=Math.max(10,Math.min(petX,g.clientWidth-90));PET.style.left=petX+'px'}
  Object.keys(keep).forEach(id=>{const el=$(id);if(el&&keep[id]!==''&&!['sg','st','sd','ss'].includes(id)||el&&id===fid)el.value=keep[id]});
  if(fid){const el=$(fid);if(el){el.value=fval;el.focus()}}
}

/* ---------- actions ---------- */
function enter(role){U.role=role;U.screen='app';U.err='';LS.set('role',role);prevPoints=D.points;if(role==='kid'){petGreet();const k='lvl_'+fam().season;if(LS.get(k)===null)LS.set(k,D.points>=fam().target?5:level())}render()}
function startTimer(id){const tk=D.tasks.find(x=>x.id===id);U.timer={id,title:tk?tk.title:'Таймер',end:Date.now()+((tk&&tk.timer)||5)*60000};sayG('timer_start');U.over='timer';render();clearInterval(startTimer.h);
  startTimer.h=setInterval(()=>{if(Date.now()>=U.timer.end){clearInterval(startTimer.h);const t=U.timer.id;U.timer=null;U.over=null;render();sayG('timer_end');markQuest(t,true)}else render()},1000)}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='retry'){U.err='';render();return boot()}
  if(a==='leave'){LS.del('code');LS.del('role');LS.del('state');S0=null;pend.length=0;code=null;D=null;U.err='';U.screen='join';return render()}
  if(a==='who'){U.err='';if(id==='kid')return enter('kid');if(U.pin&&U.role===id)return enter(id);U.pinRole=id;U.screen='pin';return render()}
  if(a==='back'||a==='switch'){U.screen='who';U.err='';U.over=null;clearInterval(startTimer.h);return render()}
  if(a==='tab'){if(U.role==='kid'){U.tab=id;if(id==='mail'&&D.msgs[0])LS.set('seen',D.msgs[0].at)}else U.ptab=id;beep(440,.04);return render()}
  if(a==='tap'){const t=D.tasks.find(x=>x.id===id);if(!t)return;if(t.timer)return startTimer(id);return markQuest(id)}
  if(a==='stop'){clearInterval(startTimer.h);U.timer=null;U.over=null;return render()}
  if(a==='close'){const was=U.over;U.over=null;render();if(was==='level'||was==='win')setTimeout(()=>sayG(was),300);return}
  if(a==='ava')return act('mq_profile',{p_avatar:id,p_theme:null},null,s=>{s.family.avatar=id});
  if(a==='theme'){LS.set('mytheme',id);return act('mq_profile',{p_avatar:null,p_theme:id},null,s=>{s.family.theme=id})}
  if(a==='mytheme'){LS.set('mytheme',id);return render()}
  if(a==='ok'||a==='no'){const ok=a==='ok';
    const p=act('mq_decide',Object.assign(adult(),{p_done:id,p_ok:ok}),ok?'Подтверждено':'Возвращено на доделку',s=>{const d=s.done.find(x=>x.id===id&&x.status==='pending');if(!d)return;d.status=ok?'approved':'rejected';if(ok){d.points=d.tp;s.points+=d.tp}});
    if(ok){coins();beep(880)}return p}
  if(a==='delmsg')return act('mq_msg_del',Object.assign(adult(),{p_msg:id}),'Сообщение удалено',s=>{s.msgs=s.msgs.filter(m=>m.id!==id)});
  if(a==='sure'){if(U.sure!==id){U.sure=id;clearTimeout(U.sureH);U.sureH=setTimeout(()=>{U.sure=null;render()},5000);return render()}
    U.sure=null;if(id==='clearchat')return act('mq_msg_clear',adult(),'Чат очищен',s=>{s.msgs=[]});
    if(id==='reset')return act('mq_reset_progress',adult(),'Монеты и отметки обнулены',s=>{s.done=[];s.points=0;s.family.start_date=today()})}
  if(a==='hide'){U.edit=null}
  if(a==='hide')return act('mq_task_hide',Object.assign(adult(),{p_task:id}),'Квест убран',s=>{s.tasks=s.tasks.filter(t=>t.id!==id)});
  if(a==='icon'){U.icon=id;return render()}
  if(a==='edit'){U.edit=id;return render()}
  if(a==='editx'){U.edit=null;return render()}
  if(a==='tpl'){const x=TPL[+id];if(!x)return;return act('mq_task_add',Object.assign(adult(),{p_title:x[1],p_icon:x[0],p_points:x[2],p_kind:x[3],p_timer:x[4],p_due:''}),'Квест добавлен: '+x[1],s=>{s.tasks.push({id:'tmp'+Date.now(),title:x[1],icon:x[0],points:x[3]==='care'?0:x[2],kind:x[3],timer:x[4],due:''})})}
  if(a==='pet'){petPoke();return}
  if(a==='video'){if(AUD)AUD.pause();const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px';o.innerHTML='<video src="video/'+(id==='mama'?'mama':'melissa')+'.mp4?v=2" controls autoplay playsinline style="max-height:82vh;max-width:94vw;border-radius:14px"></video><button type="button" class="btn px">Закрыть</button>';o.querySelector('button').onclick=()=>o.remove();o.addEventListener('click',e=>{if(e.target===o)o.remove()});document.body.appendChild(o);return}
  if(a==='voice'){LS.set('voice',LS.get('voice')==='off'?'on':'off');if(LS.get('voice')!=='off')petSay('Мур! Теперь я разговариваю.',true,'v01');return render()}
  if(a==='quick'){const r=U.role;return act('mq_say',Object.assign(adult(),{p_body:id}),'Отправлено',s=>{s.msgs.unshift({id:'tmp'+Date.now(),from:r,body:id,sys:false,at:new Date().toISOString()})})}
  if(a==='copy'){try{await navigator.clipboard.writeText(id);toast('Ссылка скопирована')}catch(err){toast('Не получилось скопировать. Код: '+code)}return}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target.dataset.form;
  if(f==='join'){code=$('code').value.trim().toUpperCase();U.err='';const ok=await load(false);if(ok){LS.set('code',code);U.screen='who';U.err='';render()}else{if(ok===false)U.err=ERR.bad_code;render()}}
  else if(f==='pin'){const pin=$('pin').value.trim(),role=U.pinRole,has=fam()[role+'_has_pin'];
    if(!/^[0-9]{4}$/.test(pin)){U.err=ERR.pin_format;return render()}
    try{if(has)await rpc('mq_check_pin',{p_code:code,p_role:role,p_pin:pin});else{const s=await rpc('mq_set_pin',{p_code:code,p_role:role,p_pin:pin});setServer(s)}
      U.pin=pin;enter(role)}catch(err){U.err=errText(err);$('pin').value='';render()}}
  else if(f==='say'){const t=$('mt').value.trim();if(!t)return;const kid=U.role==='kid';$('mt').value='';
    const r=kid?'child':U.role;await act('mq_say',kid?{p_role:'child',p_pin:null,p_body:t}:Object.assign(adult(),{p_body:t}),'Отправлено',s=>{s.msgs.unshift({id:'tmp'+Date.now(),from:r,body:t,sys:false,at:new Date().toISOString()})})}
  else if(f==='edit'){const id=e.target.dataset.id,ep=$('ep'),pts=ep?+ep.value:null,due=$('ed').value||'',tm=+$('et').value;U.edit=null;
    await act('mq_task_edit',Object.assign(adult(),{p_task:id,p_points:pts,p_due:due,p_timer:tm}),'Сохранено',s=>{const t=s.tasks.find(x=>x.id===id);if(!t)return;if(pts!=null&&t.kind!=='care')t.points=Math.max(1,Math.min(10,pts||t.points));t.due=due;t.timer=tm})}
  else if(f==='petname'){const n=$('pn').value.trim().slice(0,16);if(n){LS.set('petname',n);petSay('Ура! Теперь у меня есть имя!',true,'n01')}render()}
  else if(f==='task'){const t=$('nt').value.trim();if(!t)return;const args=Object.assign(adult(),{p_title:t,p_icon:U.icon,p_points:+$('np').value||1,p_kind:$('nk').value});$('nt').value='';
    await act('mq_task_add',args,'Квест добавлен')}
  else if(f==='settings'){await act('mq_settings',Object.assign(adult(),{p_goal:$('sg').value,p_target:+$('st').value,p_days:+$('sd').value,p_start:$('ss').value}),'Сохранено')}
});

async function boot(){
  const h=decodeURIComponent(location.hash.slice(1)).trim().toUpperCase();
  code=h||LS.get('code');
  if(h){try{history.replaceState(null,'',location.pathname)}catch(e){}}
  if(!code){U.screen='join';return render()}
  const cached=LS.get('state');
  if(cached&&LS.get('code')===code){
    try{S0=JSON.parse(cached);lastJson=cached;D=clone(S0);prevPoints=D.points;
      if(LS.get('role')==='kid')enter('kid');else{U.screen='who';render()}
      const ok2=await load(true);
      if(ok2===false){LS.del('code');LS.del('state');code=null;D=null;S0=null;U.screen='join';U.err=ERR.bad_code;render()}
      return}catch(e){S0=null;D=null}
  }
  U.screen='load';render();
  const ok=await load(false);
  if(ok===false){LS.del('code');code=null;U.screen='join';U.err=ERR.bad_code;return render()}
  if(ok===null)return;
  LS.set('code',code);U.err='';
  if(LS.get('role')==='kid')enter('kid');else{U.screen='who';render()}
}
setInterval(()=>{if(U.screen==='app'&&!document.hidden&&!U.busy&&!pend.length&&U.over!=='timer')load(true)},10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&U.screen==='app')load(true)});
applyTheme();render();boot();
</script>
